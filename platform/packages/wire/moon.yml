# `wire` is the native wire library's id; this is its TypeScript side.
id: "platform-wire"

project:
  description: "The native /v1 messages in TypeScript, byte for byte with native/libs/wire: session hello and exchange, frames, leases, starts, enrollments and refusals; the override document; the module container, its download stream and the release seal."

language: "typescript"
layer: "library"

dependsOn:
  - "platform-bundle"
  - "platform-core"

tasks:
  # The golden vectors are the other half of what the tests check.
  test:
    inputs:
      - "**/*"
      - "/contracts/wire/**/*"
      - "/contracts/container/**/*"
      - "/contracts/container-stream/**/*"
      - "/contracts/release-seal/**/*"
      - "/contracts/ed25519/**/*"
      - "/contracts/overrides/**/*"
