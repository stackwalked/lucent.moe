project:
  description: "The authority: accounts, credentials, sessions, roles and entitlements, and the native /v1 path, over PostgreSQL."

language: "typescript"
layer: "application"

dependsOn:
  - "platform-bundle"
  - "platform-core"
  - "policy"
  - "catalog"
  - "rpc"
  - "platform-wire"
  - "platform-testing"

tasks:
  # The server against a persistent local cluster under .moon/cache/dev, migrated on start.
  dev:
    command: "bun dev/dev.ts"
    preset: "server"
    options:
      envFile:
        - "/.config/dev.env"
        - "/.config/dev.local.env"
  # Migrates the dev database and writes its root account (root@lucent.localhost).
  seed:
    command: "bun dev/seed.ts"
    options:
      cache: false
      runInCI: false
