project:
  description: "The authority: accounts, credentials, sessions, roles and entitlements, over PostgreSQL."

language: "typescript"
layer: "application"

tasks:
  # The server against a persistent local cluster under .moon/cache/dev, migrated on start.
  dev:
    command: "bun dev/dev.ts"
    preset: "server"
    options:
      envFile: "/.config/dev.env"
  # Migrates the dev database and writes its root account (root@lucent.localhost).
  seed:
    command: "bun dev/seed.ts"
    options:
      cache: false
      runInCI: false
