project:
  description: "The development host: maps a module into a process and talks to it over the session."

language: "cpp"
layer: "tool"

dependsOn: ["kit", "manualmap", "os", "pe", "wire"]

workspace:
  inheritedTasks:
    exclude: ["test"]

tasks:
  # Maps the dev build of the cs2 module (`-- --os-loader` loads it with LoadLibraryW instead, for a
  # debugger with symbols); pass another process name after `--` to try it on a
  # stand-in. Interactive: Enter unloads.
  inject:
    command: "$workspaceRoot/.moon/cache/cmake/dev/tools/loader-dev/loader-dev.exe $workspaceRoot/.moon/cache/cmake/dev/targets/cs2/lucent_cs2.dll"
    deps: ["native:build"]
    options:
      cache: false
      interactive: true
      runInCI: false
      # Through pwsh, the quoted exe path followed by an argument parses as an expression.
      shell: false
