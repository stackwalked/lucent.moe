language: "cpp"
layer: "tool"

dependsOn: ["kit", "os", "pe"]

workspace:
  inheritedTasks:
    exclude: ["test"]

tasks:
  # Injects the dev build of the cs2 module; pass another process name after `--` to try it on a
  # stand-in. Interactive: Enter unloads.
  inject:
    command: "$workspaceRoot/.moon/cache/cmake/dev/tools/loader-dev/loader-dev.exe $workspaceRoot/.moon/cache/cmake/dev/targets/cs2/lucent_cs2.dll"
    deps: ["native:build"]
    options:
      cache: false
      interactive: true
      runInCI: false
      # Through pwsh, the quoted exe path followed by an argument parses as an expression.
      shell: false
