language: "cpp"
layer: "tool"

dependsOn: ["crypto", "kit", "os", "pe", "wire"]

# lucent_module() runs it after linking each module in Release builds (cmake/lucent.cmake).
workspace:
  inheritedTasks:
    exclude: ["test"]
