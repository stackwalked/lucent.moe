id: "cs2-finders"

project:
  description: "How the generator derives cs2's facts from the game's module files. Tooling: linked by the generator only, never by the module."

language: "cpp"
layer: "library"

dependsOn: ["core", "cs2-modules", "finder", "kit", "pe", "probe"]

# Its finders run against real game binaries, which never enter git; the finder language is tested
# in libs/probe against fixtures, and the finders by the generator's report.
workspace:
  inheritedTasks:
    exclude: ["test"]
