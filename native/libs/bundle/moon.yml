project:
  description: "The fact bundle format: signed fact sets, and Merkle-proven subsets of them delivered to modules."

language: "cpp"
layer: "library"

dependsOn: ["core", "crypto", "os"]

tasks:
  # Rewrites the golden vectors in contracts/fact-bundle and contracts/release-manifest (v1, v2
  # and v3) from the encoders. Review the diff before committing: a changed vector is a changed
  # wire format.
  vectors:
    command: "ctest --test-dir $workspaceRoot/.moon/cache/cmake/dev -L ^bundle$ -R golden --output-on-failure"
    deps: ["native:build"]
    env:
      LUCENT_WRITE_VECTORS: "1"
    options:
      cache: false
      runInCI: false
      mutex: "ctest"
