project:
  description: "The CMake tree: toolchain, presets and vcpkg, and the one configure and build every native project shares."

layer: "configuration"

# The CMake tree as a whole: one configure and one build for every native project. Not cached by
# moon: Ninja is incremental already, and a cached pass would skip a deleted build directory.
tasks:
  # Configures once, then leaves reruns to Ninja (cmake/configure.cmake says why).
  configure:
    command: "cmake -P cmake/configure.cmake"
    inputs:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/**/*"
      - "*/CMakeLists.txt"
      - "/.prototools"
    options:
      cache: false
  # Only the headers the build generates (shaders, devkey's public key): what lint needs from a
  # build, without waiting for, or competing for memory with, the whole tree's compile.
  generate:
    command: "cmake --build --preset dev --target lucent_generated"
    deps: ["~:configure"]
    inputs:
      - "**/*"
      - "/.prototools"
    options:
      cache: false
  build:
    command: "cmake --build --preset dev"
    deps: ["~:configure"]
    inputs:
      - "**/*"
      - "/.prototools"
    options:
      cache: false
  # The libFuzzer targets under ASan (the fuzz preset), in their own tree. Kept out of check: a
  # second configure and a full ASan build of the parsers, and the fuzzing itself, cost minutes,
  # where check costs seconds. Run one for a minute, from the repo root:
  #   .moon/cache/cmake/fuzz/libs/bundle/bundle_fuzz_decode.exe .moon/cache/fuzz/bundle_decode
  #     contracts/fact-bundle/v1 -max_total_time=60 -artifact_prefix=.moon/cache/fuzz/
  # The first directory (create it first) collects the inputs it finds, the prefix any crash; both
  # stay under the ignored .moon/cache. Each target's file says what to seed it with.
  fuzz-build:
    script: "cmake --preset fuzz && cmake --build --preset fuzz"
    options:
      cache: false
      runInCI: false
  check:
    deps: ["~:build"]
    inputs:
      - "**/*"
      - "/.prototools"
