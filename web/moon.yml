project:
  description: "lucent.moe in the browser: TanStack Start on React, served by its own Bun entry."

language: "typescript"
layer: "application"

dependsOn:
  - "platform-core"
  - "policy"
  - "rpc"
  - "platform-testing"

tasks:
  # routeTree.gen.ts is generated, never committed: Start's own plugin writes it, through a Vite
  # server started and closed again.
  routes:
    command: "bun dev/routes.ts"
    inputs:
      - "src/routes/**/*"
      - "src/router.tsx"
      - "vite.config.ts"
    outputs:
      - "src/routeTree.gen.ts"
  # The icon sprite (from the vendored Lucide SVGs) and each CSS module's class types; gitignored
  # like the route tree.
  generate:
    command: "bun dev/generate.ts"
    inputs:
      - "src/**/*.module.css"
      - "src/ui/icons/lucide/*.svg"
      - "dev/generate.ts"
      - "dev/icons.ts"
      - "dev/css-types.ts"
    outputs:
      - "src/ui/icons/sprite.gen.svg"
      - "src/**/*.module.d.css.ts"
  # Module CSS uses tokens only, inside its layer (dev/css-lint.ts).
  css:
    command: "bun dev/css-lint.ts"
    inputs:
      - "src/**/*.css"
      - "src/ui/tokens.ts"
      - "dev/css-lint.ts"
  check:
    deps: ["~:css", "~:integration"]
  typecheck:
    deps: ["~:routes", "~:generate"]
  test:
    command: "bun test ./tests"
    deps: ["~:generate"]
  # Web's production build against platform as an operator starts it, each in its own process, on
  # an ephemeral Postgres (@lucent/testing): the flows that cross both and live in cookies.
  integration:
    command: "bun test ./integration"
    deps: ["~:build"]
    inputs:
      - "integration/**/*"
      - "/platform/server/src/**/*"
      - "/platform/server/migrations/**/*"
      - "/platform/packages/*/src/**/*"
      - "/products/**/*"
  build:
    command: "bun --bun vite build"
    deps: ["~:routes", "~:generate"]
    inputs:
      - "src/**/*"
      - "vite.config.ts"
    outputs:
      - "dist"
  # Vite with hot reload on :4710, beside the platform it calls. --bun runs Vite (and with it the
  # server code it loads) under Bun, as production runs; without it Vite's node shebang wins.
  dev:
    command: "bun --bun vite"
    deps: ["~:routes", "~:generate", "server:dev"]
    preset: "server"
    options:
      envFile: "/.config/dev.env"
  # The production build behind the real entry, for checking it locally.
  start:
    command: "bun src/main.ts"
    deps: ["~:build"]
    preset: "server"
    options:
      envFile: "/.config/dev.env"
