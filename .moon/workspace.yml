projects:
  globs:
    - "tools/*/moon.yml"
    - "platform/*/moon.yml"
    - "platform/packages/*/moon.yml"
    - "web/moon.yml"
    - "native/moon.yml"
    - "native/*/moon.yml"
    - "native/libs/*/moon.yml"
    - "native/libs/render/*/moon.yml"
    - "native/libs/render/backends/*/moon.yml"
    - "native/targets/*/moon.yml"
    - "native/targets/*/*/moon.yml"
    - "native/tools/*/moon.yml"

# Repo-wide tasks take /**/* as input; the native build tree under .moon/cache is output, and
# vcpkg holds locks in it while configuring. Agent worktrees are whole checkouts with build trees
# of their own, changing under a running hash.
hasher:
  ignorePatterns:
    - ".moon/cache/**"
    - ".claude/worktrees/**"

vcs:
  client: "git"
  defaultBranch: "main"
  provider: "github"
  sync: true
  hooks:
    pre-commit:
      # The staged files come from git, which reads the index being committed (GIT_INDEX_FILE: a
      # temporary one for `git commit -- <paths>`). moon's own --status staged reads the real index,
      # so such a commit ran no checks at all for files not already added to it.
      - "git diff --cached --name-only | moon run :check --affected --stdin"
    commit-msg:
      # Through moon, so the hook runs the pinned uv rather than whatever PATH finds first.
      - "moon run repo:commit-msg --quiet -- $ARG1"
