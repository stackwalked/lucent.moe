inheritedBy:
  languages: ["typescript", "javascript"]

# Biome owns formatting and import order for TS/JS; `biome ci` checks both with lint.
# Root config and pins are inputs, or a stricter rule would be hidden behind a cached pass.
implicitInputs:
  - "/biome.jsonc"
  - "/tsconfig.base.json"
  - "/bun.lock"

tasks:
  lint:
    command: "bun biome ci ."
  typecheck:
    command: "bun tsc --noEmit -p ."
  check:
    deps: ["~:lint", "~:typecheck"]
  fix:
    command: "bun biome check --write ."
    options:
      cache: false
