inheritedBy:
  language: "cpp"

# Lint and tests per project; native:build compiles the whole tree once. Lint needs a configured
# tree (compile_commands.json) and the headers the build generates (native:generate), which some
# units include; it doesn't wait for the whole build.
implicitInputs:
  - "/native/.clang-tidy"
  - "/tools/lint/tidy.py"

tasks:
  lint:
    command: "uv run $workspaceRoot/tools/lint/tidy.py ."
    deps: ["native:generate"]
    options:
      # tidy.py already runs one clang-tidy per core; projects linting at once multiplied that past
      # memory (LLVM out-of-memory in whichever lint lost the race).
      mutex: "clang-tidy"
  test:
    command: "ctest --test-dir $workspaceRoot/.moon/cache/cmake/dev -L ^$project$ --output-on-failure --no-tests=error"
    deps: ["native:build"]
    options:
      cache: false
      # Every project's tests share one build tree, and concurrent CTest runs in one tree mix
      # their state: a run reported tests from other projects as its own.
      mutex: "ctest"
  # Applies misc-include-cleaner's fixes, the one lint finding that is pure bookkeeping, then
  # formats. Run it before lint on new code; check never runs it.
  fix:
    command: "uv run $workspaceRoot/tools/lint/tidy.py --fix ."
    deps: ["native:configure"]
    options:
      cache: false
      runInCI: false
  check:
    deps: ["~:lint"]
