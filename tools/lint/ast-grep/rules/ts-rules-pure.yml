id: ts-rules-pure
language: TypeScript
severity: error
message: "pass gathered values to rules; keep effects in the writer"
files:
  - "**/*.rules.ts"
rule:
  any:
    - all:
        - any:
            - kind: arrow_function
            - kind: function_expression
            - kind: function_declaration
            - kind: generator_function
            - kind: generator_function_declaration
            - kind: method_definition
        - regex: ^(?:(?:public|private|protected|static|override|readonly)\s+)*async\b
    - kind: await_expression
    - kind: for_in_statement
      regex: ^for\s+await\b
    - pattern: Bun.$MEMBER
    - any:
        - kind: import_statement
        - kind: export_statement
      has:
        field: source
        matches: effect-module
    - pattern: import($MODULE)
      has:
        stopBy: end
        matches: effect-module
utils:
  effect-module:
    kind: string
    regex: ^["'](?:node:|bun["']|(?:[^"']*/)?(?:db|listeners|adapters)/)
