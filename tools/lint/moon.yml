project:
  description: "The checks no off-the-shelf tool expresses, and the dialects' ast-grep rules."

language: "python"
layer: "tool"

tasks:
  test:
    command: "uv run --frozen pytest -q"
  test-rules:
    command: "uv run --frozen ast-grep test --config ast-grep/sgconfig.yml --skip-snapshot-tests"
