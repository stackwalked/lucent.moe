project:
  description: "Repo-wide tasks: formatting, cross-language checks and the commit hooks."

layer: "configuration"

# Repo-wide tasks. Code is linted by its own project's inherited tasks; these cover what
# belongs to the whole tree: docs and data formatting, and cross-language rules. The project
# lives here rather than at the root to keep the root clear; its tasks still run over and
# from the whole workspace. Its id doubles as the commit scope for changes outside any project.
#
# The file checks run through staged.py: in a commit hook they see the index being committed, not
# the working tree, so a checkout shared by several sessions can't fail one session's commit on
# another's unstaged work. moon hashes the working tree, which in a hook is not what is checked,
# so their results are never cached.
taskOptions:
  runFromWorkspaceRoot: true

tasks:
  # Without dprint's incremental cache: it can't see formatter versions or config files such as
  # native/.clang-format, so a cached pass could hide a stricter rule.
  format:
    command: "uv run tools/lint/staged.py dprint check --incremental=false"
    options: { cache: false }
    inputs: ["/**/*", "!/**/node_modules/**/*", "!/**/node_modules/*"]
  suppressions:
    command: "uv run tools/lint/staged.py uv run tools/lint/suppressions.py"
    options: { cache: false }
    inputs: ["/**/*", "!/**/node_modules/**/*", "!/**/node_modules/*"]
  includes:
    command: "uv run tools/lint/staged.py uv run tools/lint/includes.py"
    options: { cache: false }
    inputs:
      - "/native/**/*"
      - "/tools/lint/includes.py"
      - "/uv.lock"
      - "!/**/node_modules/**/*"
      - "!/**/node_modules/*"
  ast-grep:
    command: "uv run tools/lint/staged.py uv run --frozen ast-grep scan --config tools/lint/ast-grep/sgconfig.yml native platform web"
    options: { cache: false }
    inputs:
      - "/native/**/*"
      - "/platform/**/*"
      - "/web/**/*"
      - "/tools/lint/ast-grep/**/*"
      - "/uv.lock"
      - "!/**/node_modules/**/*"
      - "!/**/node_modules/*"
  # Reports the uses of kit's `raw` escape hatch; it gates nothing yet.
  raw-count:
    command: "uv run tools/lint/staged.py uv run tools/lint/raw_count.py"
    options: { cache: false }
    inputs:
      - "/native/**/*"
      - "/tools/lint/raw_count.py"
      - "/uv.lock"
  # The roots mirror ts_hygiene.py's TS_ROOTS; one left out lets a cached pass hide a violation.
  ts-hygiene:
    command: "uv run tools/lint/staged.py uv run tools/lint/ts_hygiene.py"
    options: { cache: false }
    inputs:
      - "/**/package.json"
      - "/contracts/**/*"
      - "/platform/**/*"
      - "/products/**/*"
      - "/web/**/*"
      - "/tools/lint/ts_hygiene.py"
      - "/uv.lock"
      - "!/**/node_modules/**/*"
      - "!/**/node_modules/*"
  commit-msg:
    command: "uv run tools/lint/commit_msg.py"
    options:
      cache: false
      runInCI: false
  # A deps-only task still needs inputs: moon decides "affected" from the requested
  # target's own inputs, not its deps'.
  check:
    inputs: ["/**/*", "!/**/node_modules/**/*", "!/**/node_modules/*"]
    deps: ["~:format", "~:suppressions", "~:includes", "~:ast-grep", "~:ts-hygiene", "~:raw-count"]
  fix:
    command: "dprint fmt --incremental=false"
    options:
      cache: false
